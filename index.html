<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>라이트로드 | 스마트 조명제어 교통안전시설</title>
  <meta name="description" content="㈜라이트로드 — 스마트 조명제어 통합관리 시스템으로 교통안전, 에너지 절감, 빛공해 저감에 기여합니다.">
  <link rel="icon" href="favicon.ico" />
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#f6f8fb; --surface:#ffffff; --text:#1c2430; --muted:#5d6b82; --line:#e5eaf2;
      --brand:#2563eb; --brand-2:#4f46e5; --max:1200px; --radius:16px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard",system-ui,-apple-system,Segoe UI,Roboto,"Noto Sans KR",Arial,sans-serif}
    a{color:inherit;text-decoration:none}
    .wrap{max-width:var(--max);margin:0 auto;padding:0 24px}
    header{position:sticky;top:0;background:rgba(255,255,255,.85);backdrop-filter:saturate(160%) blur(10px);border-bottom:1px solid var(--line);z-index:20}
    .nav{height:64px;display:flex;align-items:center;justify-content:space-between}
    .logo{font-weight:800;letter-spacing:.2px}
    .logo b{color:var(--brand)}
    .menu a{margin-left:20px;color:var(--muted);font-weight:600}
    .menu a:hover{color:var(--brand)}
    .hero{background:linear-gradient(180deg,#eef3ff,transparent);padding:56px 0 48px;border-bottom:1px solid var(--line)}
    .hero .title{font-size:38px;line-height:1.2;margin:0 0 10px}
    .hero .lead{color:var(--muted);font-size:18px;margin:0 0 24px}
    .cta-row{display:flex;gap:12px;flex-wrap:wrap}
    .btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:700}
    .btn.primary{background:linear-gradient(90deg,var(--brand),var(--brand-2));color:#fff;border:none}
    .searchbar{display:flex;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;gap:8px;max-width:560px}
    .searchbar input{flex:1;border:none;outline:none;font-size:15px}
    .cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:28px 0}
    .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
    .card h3{margin:0 0 6px}
    .muted{color:var(--muted)}
    section{padding:44px 0}
    .two{display:grid;grid-template-columns:1.1fr .9fr;gap:20px}
    img.hero-illus{width:100%;height:auto;display:block}
    figure{margin:0}
    img.responsive{width:100%;height:auto;border:1px solid var(--line);border-radius:12px}
    footer{border-top:1px solid var(--line);padding:28px 0;color:var(--muted);background:#fff}
    .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .chip{font-size:12px;color:#3a4b66;border:1px solid var(--line);background:#f3f6fb;border-radius:999px;padding:4px 10px}
    @media (max-width:980px){
      .two{grid-template-columns:1fr}
      .cards{grid-template-columns:1fr 1fr}
      .hero .title{font-size:32px}
    }
    @media (max-width:620px){
      .cards{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <!-- 헤더 -->
  <header>
    <div class="wrap nav">
      <div class="logo"><b>LIGHT</b>ROAD</div>
      <nav class="menu">
        <a href="#about">회사소개</a>
        <a href="#products">제품</a>
        <a href="#tech">기술</a>
        <a href="#energy">효과</a>
        <a href="#contact">문의</a>
      </nav>
    </div>
  </header>

  <!-- 히어로 -->
  <section class="hero">
    <div class="wrap two">
      <div>
        <h1 class="title">스마트 조명제어로<br>교통안전과 에너지 절감을 동시에</h1>
        <p class="lead">외부 조도·시간·상황에 따라 밝기를 연속 제어하는
